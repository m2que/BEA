    <style>
      :root {
        --bg-cream: #f6f0e5;
        --bg-sand: #eadcc5;
        --bg-panel: rgba(255, 250, 242, 0.88);
        --bg-panel-strong: rgba(255, 248, 237, 0.96);
        --ink: #1f2a24;
        --muted: #5d685f;
        --border: rgba(82, 68, 48, 0.16);
        --accent: #0f766e;
        --accent-strong: #115e59;
        --accent-warm: #c98b2e;
        --error: #b42318;
        --score-strong: #1f8a70;
        --score-mid: #d08b2d;
        --score-weak: #cb4b3f;
        --shadow-lg: 0 24px 80px rgba(79, 57, 25, 0.14);
        --shadow-md: 0 16px 44px rgba(79, 57, 25, 0.1);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --icon-tile-size: 44px;
        --icon-tile-radius: 16px;
        --icon-size-md: 20px;
        --icon-size-lg: 26.4px;
        --icon-stroke-standard: 1.8;
        --icon-stroke-strong: 2;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at top left, rgba(201, 139, 46, 0.18), transparent 24%),
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.16), transparent 28%),
          linear-gradient(180deg, #fffaf2 0%, var(--bg-cream) 46%, var(--bg-sand) 100%);
        color: var(--ink);
        font-family: 'Manrope', sans-serif;
      }

      a {
        color: var(--accent-strong);
      }

      button,
      input,
      select {
        font: inherit;
      }

      #root {
        min-height: 100vh;
      }

      .app-shell {
        position: relative;
        min-height: 100vh;
      }

      .page-backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.35), transparent 18%),
          radial-gradient(circle at 85% 10%, rgba(17, 94, 89, 0.08), transparent 16%);
      }

      .page-content {
        position: relative;
        z-index: 1;
        width: min(1280px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-lg);
        backdrop-filter: blur(10px);
        padding: 28px;
      }

      .panel + .panel,
      .report-stack > .panel + .panel,
      .results-stack > * + * {
        margin-top: 24px;
      }

      .panel-soft {
        background: var(--bg-panel-strong);
      }

      .panel-intro {
        background: linear-gradient(180deg, rgba(255, 252, 247, 0.96), rgba(247, 240, 229, 0.94));
      }

      .page-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 22rem);
        gap: 24px;
        margin-bottom: 24px;
        align-items: end;
        padding: 28px;
      }

      .page-header-copy {
        max-width: 48rem;
      }

      .page-header-copy h1 {
        margin-top: 0;
        font-size: clamp(2.4rem, 5vw, 4.6rem);
        line-height: 0.98;
        letter-spacing: -0.03em;
        max-width: none;
        white-space: nowrap;
      }

      .page-header-copy p {
        max-width: 48rem;
        margin-top: 20px;
        font-size: 1rem;
        line-height: 1.7;
      }

      .header-badge,
      .input-badge,
      .section-chip,

        display: inline-flex;
        align-items: center;
        gap: 10px;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.84rem;
        font-weight: 700;
      }

      .header-badge {
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent-strong);
        margin-bottom: 16px;
        gap: 12px;
        padding: 8px 16px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;

      .section-chip-icon,

      .reference-link-icon,

        border: 1px solid rgba(82, 68, 48, 0.12);
        background: rgba(255, 251, 245, 0.88);

      .header-note-card {

        border-color: rgba(15, 118, 110, 0.12);

      .report-hero-icon,
      .empty-state-icon,
      .error-icon-wrap,
      .competitive-summary-topline,

        align-items: center;
        justify-content: center;
      }

        align-items: center;
        justify-content: center;
        width: var(--icon-tile-size);
        height: var(--icon-tile-size);
        border-radius: var(--icon-tile-radius);
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent-strong);
        flex: 0 0 auto;
      }

      .header-note-icon,
      .report-hero-icon,
      .error-icon-wrap,
      .empty-state-icon {
        width: var(--icon-tile-size);
        height: var(--icon-tile-size);
      }

      .header-note-icon {

        height: 44px;
        border-radius: 16px;

      .header-note-icon svg,

        width: var(--icon-size-lg);
        height: var(--icon-size-lg);

      .report-hero-card span,
      .competitive-summary-card p,
      .competitive-summary-topline span,

        font-weight: 600;

        margin-top: 12px;

        line-height: 1.75;
        color: var(--muted);

        border-radius: 999px;

        font-weight: 800;

        display: grid;

      }

      .cbbe-style-field,

        display: flex;

      }

      .cbbe-style-field input {
        width: 100%;
        border-radius: 18px;
        border: 1px solid rgba(255, 248, 225, 0.36);
        background: rgba(255, 250, 240, 0.14);
        padding: 14px 16px;
        color: #fff8ea;
        font-size: 1.125rem;
        box-shadow: inset 0 1px 0 rgba(255, 248, 225, 0.12), 0 18px 40px rgba(2, 24, 23, 0.28);
        backdrop-filter: blur(10px);
      }

        color: rgba(246, 231, 200, 0.72);
      }

      .cbbe-style-model-field {
        justify-content: center;
        border-radius: 18px;
        border: 1px solid rgba(255, 248, 225, 0.28);

        background: transparent;
        padding: 0;
        color: #fff8ea;
        font-size: 0.95rem;
      }

        background: #0d3b39;
        color: #fff8ea;
      }

        color: rgba(248, 239, 218, 0.86);
        line-height: 1.5;
      }

      .cbbe-style-submit-button {
        border-radius: 18px;
        padding: 14px 24px;
      }

        margin: 0;
        padding-left: calc(100% - 220px);
        font-size: 0.875rem;
        font-weight: 600;
        color: #ffe2b8;
      }

        background: rgba(255, 250, 242, 0.88);
      }

      .support-card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .support-card-item {
        padding: 18px;
        border-radius: 18px;
        border: 1px solid rgba(82, 68, 48, 0.12);
        background: rgba(255, 251, 245, 0.72);
      }

      .support-card-item strong {
        display: block;
        font-family: 'Fraunces', serif;
        font-size: 1.15rem;
        color: var(--ink);
      }

      .support-card-item p {
        margin: 10px 0 0;
      }

      .support-reference-callout {
        margin-top: 18px;
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid rgba(15, 118, 110, 0.14);
        background: rgba(15, 118, 110, 0.06);
      }

      .support-reference-callout strong {
        display: block;
        font-family: 'Fraunces', serif;
        font-size: 1.1rem;
        color: var(--accent-strong);
      }

      .support-reference-callout p {
        margin: 8px 0 0;
      }

      .support-competitor-field {
        display: flex;
        flex-direction: column;
        gap: 8px;

        letter-spacing: 0.12em;

        width: 100%;
        border: 1px solid rgba(82, 68, 48, 0.16);
        border-radius: 18px;
        padding: 14px 16px;
        color: var(--ink);
        background: rgba(255, 252, 247, 0.88);
      }

      .support-competitor-field small {
        color: var(--muted);
      }

      .support-competitor-field-dark {
        margin-top: 4px;
      }

      .support-competitor-field-dark span {
        color: #f6e7c8;
      }

      .support-competitor-field-dark input {
        border: 1px solid rgba(255, 248, 225, 0.36);
        background: rgba(255, 250, 240, 0.14);
        color: #fff8ea;
        box-shadow: inset 0 1px 0 rgba(255, 248, 225, 0.12), 0 18px 40px rgba(2, 24, 23, 0.18);
      }

      .support-competitor-field-dark small {
        color: rgba(248, 239, 218, 0.86);
      }

      .input-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      .input-header h2 {
        color: #fff8ee;
      }

      .input-kicker {
        margin: 0 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: rgba(248, 239, 218, 0.78);
        font-weight: 800;
      }

      .input-badge {
        background: rgba(255, 249, 239, 0.14);
        color: #fff4de;
        border: 1px solid rgba(255, 245, 222, 0.16);
      }

      .field-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field span {
        color: #f8eed9;
        font-size: 0.86rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .field input,
      .field select {
        width: 100%;
        border: 1px solid rgba(255, 245, 222, 0.24);
        border-radius: 18px;
        padding: 14px 16px;
        color: #fffaf0;
        background: rgba(255, 249, 239, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .field input::placeholder {
        color: rgba(255, 248, 234, 0.7);
      }

      .field input:focus,
      .field select:focus {
        outline: 2px solid rgba(250, 204, 21, 0.5);
        outline-offset: 2px;
      }

      .field small,
      .helper-text {
        color: rgba(248, 239, 218, 0.82);
      }

      .form-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 14px 22px;
        font-weight: 800;
        color: #22322c;
        background: linear-gradient(135deg, #f2cb78, #d79b38);
        cursor: pointer;
        box-shadow: 0 18px 34px rgba(84, 58, 20, 0.28);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 20px 38px rgba(84, 58, 20, 0.34);
      }

      button:disabled {
        opacity: 0.58;
        cursor: not-allowed;
      }

      .inline-error {
        margin: 0;
        color: #ffe4bf;
        font-weight: 600;
      }

      .loading-panel,
      .error-panel {
        text-align: center;
      }

        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
      }

        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent-strong);
        font-weight: 700;
      }

        height: 88px;

        border-right-color: var(--accent-warm);

        background: rgba(255, 243, 240, 0.95);
        border-color: rgba(180, 35, 24, 0.18);

        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .industry-pill {

        align-items: center;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent-strong);

        font-size: 0.9rem;
      }

        color: var(--accent-strong);
      }

        table-layout: fixed;
      }

        border-bottom: 1px solid rgba(82, 68, 48, 0.12);

        word-break: break-word;
      }

      }

        padding-left: 20px;
      }
